[project]
name = "haier-local"
version = "0.1.6"
description = "Local Home Assistant integration for supported Haier/Casarte washers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["cryptography>=41.0.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
