name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt
      - name: Check generated translations
        run: python3 -I tools/generate_component_translations.py --check
      - name: Run static tests
        run: python -m pytest -q --ignore=tests/test_ha_contract.py

  ha-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Home Assistant test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'homeassistant==2026.11.0' 'pytest>=8'
      - name: Run entity contract test
        run: python -m pytest -q tests/test_ha_contract.py
