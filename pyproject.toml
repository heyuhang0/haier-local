[project]
name = "haier-local"
version = "0.1.0"
description = "Fully local Home Assistant integration for the Casarte CE AB13LWTUWCU1 washer"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["cryptography>=41.0.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
